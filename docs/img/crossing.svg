<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="system-ui,-apple-system,sans-serif"><rect width="900" height="688" fill="#f7f6f2"/><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f5d58"/></marker>
  <marker id="lead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4"><circle cx="5" cy="5" r="4" fill="#22252a"/></marker></defs><polyline points="450.0,1012.0 450.0,582.4" fill="none" stroke="#5f5d58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="450.0" y1="811.2" x2="450.0" y2="783.2" stroke="#5f5d58" stroke-width="6" marker-end="url(#ar)"/><polyline points="-217.9,344.1 211.8,344.1" fill="none" stroke="#5f5d58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-17.0" y1="344.1" x2="11.0" y2="344.1" stroke="#5f5d58" stroke-width="6" marker-end="url(#ar)"/><polyline points="450.0,105.9 450.0,-323.7" fill="none" stroke="#5f5d58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="450.0" y1="-94.9" x2="450.0" y2="-122.9" stroke="#5f5d58" stroke-width="6" marker-end="url(#ar)"/><polyline points="688.2,344.1 1117.9,344.1" fill="none" stroke="#5f5d58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="889.0" y1="344.1" x2="917.0" y2="344.1" stroke="#5f5d58" stroke-width="6" marker-end="url(#ar)"/><polyline points="450.0,582.4 450.0,105.9" fill="none" stroke="#5f5d58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="450.0" y1="358.1" x2="450.0" y2="330.1" stroke="#5f5d58" stroke-width="6" marker-end="url(#ar)"/><polyline points="211.8,344.1 688.2,344.1" fill="none" stroke="#5f5d58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="436.0" y1="344.1" x2="464.0" y2="344.1" stroke="#5f5d58" stroke-width="6" marker-end="url(#ar)"/><polyline points="450.0,582.4 450.0,423.5" fill="none" stroke="#c0661d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="529.4,344.1 688.2,344.1" fill="none" stroke="#c0661d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="211.8,344.1 370.6,344.1" fill="none" stroke="#c0661d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450.0,264.7 450.0,105.9" fill="none" stroke="#c0661d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="450.0,423.5 451.6,407.9 456.1,393.1 463.5,379.3 473.3,367.4 485.2,357.6 499.0,350.2 513.8,345.7 529.4,344.1" fill="none" stroke="#c0661d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370.6,344.1 386.2,342.5 401.0,338.0 414.8,330.6 426.7,320.8 436.5,308.9 443.9,295.1 448.4,280.3 450.0,264.7" fill="none" stroke="#c0661d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="450.0" y1="402.4" x2="450.0" y2="285.9" stroke="#f7f6f2" stroke-width="24"/><line x1="450.0" y1="402.4" x2="450.0" y2="285.9" stroke="#5f5d58" stroke-width="6"/><line x1="438" y1="402.4" x2="438" y2="285.9" stroke="#5f5d58" stroke-width="1.5"/><line x1="462" y1="402.4" x2="462" y2="285.9" stroke="#5f5d58" stroke-width="1.5"/><text x="26.5" y="52.6" font-size="15" font-weight="600" fill="#22252a" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Two one-way lines cross on different levels</text><text x="26.5" y="70.6" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Here northbound bridges over eastbound: no signals, no conflicts</text><line x1="52.9" y1="489.7" x2="291.2" y2="344.1" stroke="#6b6f76" stroke-width="1" marker-end="url(#lead)"/><text x="58.9" y="494.7" font-size="15" font-weight="600" fill="#22252a" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Turn ramp, east → north: slow-down lane</text><text x="58.9" y="512.7" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">60 m, leaves the line at full speed</text><line x1="52.9" y1="198.5" x2="418.2" y2="291.2" stroke="#6b6f76" stroke-width="1" marker-end="url(#lead)"/><text x="58.9" y="203.5" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">30 m curve at 15 mph</text><line x1="569.1" y1="119.1" x2="457.9" y2="158.8" stroke="#6b6f76" stroke-width="1" marker-end="url(#lead)"/><text x="575.1" y="124.1" font-size="15" font-weight="600" fill="#22252a" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Speed-up lane, 60 m</text><text x="575.1" y="142.1" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">merges back at full speed</text><line x1="582.4" y1="489.7" x2="497.6" y2="397.1" stroke="#6b6f76" stroke-width="1" marker-end="url(#lead)"/><text x="588.4" y="494.7" font-size="15" font-weight="600" fill="#22252a" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">The other turn, north → east,</text><text x="588.4" y="512.7" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">is the mirror image</text><text x="595.6" y="243.2" font-size="15" font-weight="600" fill="#22252a" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">With both lines one-way there are only</text><text x="595.6" y="261.2" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">two possible turns, so two ramps</text><text x="595.6" y="279.2" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">and no cloverleaf</text><text x="847.1" y="391.5" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="end" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Eastbound →</text><text x="476.5" y="666.8" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Northbound ↑</text></svg>