0" x2="464.6" y2="137.0" stroke="#5f5d58" stroke-width="5" marker-end="url(#ar)"/><polyline points="744.1,137.0 1061.8,137.0" fill="none" stroke="#5f5d58" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="888.9" y1="137.0" x2="916.9" y2="137.0" stroke="#5f5d58" stroke-width="5" marker-end="url(#ar)"/><polyline points="157.1,137.0 184.1,137.9 210.9,140.5 237.9,144.2 264.7,148.7 291.7,153.2 318.5,156.9 345.5,159.5 372.3,160.4" fill="none" stroke="#2f8f5b" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/><polyline points="372.3,160.4 528.8,160.4" fill="none" stroke="#2f8f5b" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/><polyline points="528.8,160.4 555.8,159.5 582.7,156.9 609.7,153.2 636.5,148.7 663.5,144.2 690.3,140.5 717.3,137.9 744.1,137.0" fill="none" stroke="#2f8f5b" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/><text x="19.6" y="34.3" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Main line: through vehicles never slow down for the station</text><line x1="19.6" y1="225" x2="264.1" y2="148.7" stroke="#6b6f76" stroke-width="1" marker-end="url(#lead)"/><text x="25.6" y="230" font-size="15" font-weight="600" fill="#22252a" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Exit lane</text><text x="25.6" y="248" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="start" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">brakes off the main line</text><text x="450" y="239.8" font-size="15" font-weight="600" fill="#22252a" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Sawtooth bays + platform</text><text x="450" y="257.8" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">each vehicle can leave on its own</text><line x1="880.4" y1="225" x2="635.9" y2="148.7" stroke="#6b6f76" stroke-width="1" marker-end="url(#lead)"/><text x="874.4" y="230" font-size="15" font-weight="600" fill="#22252a" text-anchor="end" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">Launch lane</text><text x="874.4" y="248" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="end" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">waits for a gap, then</text><text x="874.4" y="266" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="end" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">speeds up to join</text><text x="450" y="83.3" font-size="14" font-weight="400" fill="#6b6f76" text-anchor="middle" paint-order="stroke" stroke="#f7f6f2" stroke-width="4">300 m from split to merge</text></svg>