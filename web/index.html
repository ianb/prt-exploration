<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minneapolis PRT</title>
<style>
  :root {
    --bg: #f7f6f2; --land: #ecebe4; --edge: #b9b6ab; --water: #a9cbe8; --ink: #22252a; --muted: #6b6f76;
    --panel: rgba(255,255,255,.92); --line: #8a8780; --turn: #b5651d; --station: #2f8f5b;
    --loaded: #2563eb; --empty: #ea7a0c; --idle: #8b8f96; --arriving: #16a34a; --gap: rgba(219,39,119,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b; --land: #1e2126; --edge: #3a3e45; --water: #1f3a55; --ink: #e8e8e8; --muted: #9aa0a8;
      --panel: rgba(30,33,38,.94); --line: #6b6e75; --turn: #d08a45; --station: #4bbf80;
      --loaded: #60a5fa; --empty: #fb923c; --idle: #7c8088; --arriving: #4ade80; --gap: rgba(236,72,153,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171b; --land: #1e2126; --edge: #3a3e45; --water: #1f3a55; --ink: #e8e8e8; --muted: #9aa0a8;
    --panel: rgba(30,33,38,.94); --line: #6b6e75; --turn: #d08a45; --station: #4bbf80;
    --loaded: #60a5fa; --empty: #fb923c; --idle: #7c8088; --arriving: #4ade80; --gap: rgba(236,72,153,.25);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #panel { position: fixed; top: 12px; left: 12px; width: 280px; max-width: calc(100vw - 32px); max-height: calc(100vh - 24px); overflow: auto;
    background: var(--panel); border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 12px rgba(0,0,0,.15); box-sizing: border-box; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  label span.v { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  input[type=range] { flex: 1; }
  .row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--edge); background: transparent; color: var(--ink); cursor: pointer; }
  button.on { background: var(--ink); color: var(--bg); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  td { padding: 2px 0; } td:last-child { text-align: right; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  details { margin-top: 8px; font-size: 13px; } summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 600px) { #panel { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 45vh; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Minneapolis PRT</h1>
  <div class="sub">One-way loops every half mile, a station at the middle of each side</div>
  <div class="row">
    <button id="play" class="on">Pause</button>
    <span id="speeds"></span>
  </div>
  <table id="stats"></table>
  <div class="legend">
    <span><i class="dot" style="background:var(--loaded)"></i>carrying riders</span>
    <span><i class="dot" style="background:var(--empty)"></i>empty, moving</span>
    <span><i class="dot" style="background:var(--arriving)"></i>arriving</span>
    <span><i class="dot" style="background:var(--idle)"></i>docked</span>
  </div>
  <details>
    <summary>Scenario</summary>
    <label>Trips per hour <input id="tripsPerHour" type="range" min="1000" max="30000" step="1000" value="6000"><span class="v"></span></label>
    <label>Headway (s) <input id="headway" type="range" min="0.3" max="2" step="0.1" value="1"><span class="v"></span></label>
    <label>Vehicles per station <input id="fleetPerStation" type="range" min="1" max="20" step="1" value="5"><span class="v"></span></label>
    <label>Berths per station <input id="berths" type="range" min="4" max="24" step="1" value="10"><span class="v"></span></label>
    <div class="row"><button id="restart">Restart with these settings</button></div>
  </details>
  <details>
    <summary>Map</summary>
    <label>Show quarter-mile gaps <input id="showGaps" type="checkbox"></label>
    <label>Show stations <input id="showStations" type="checkbox" checked></label>
  </details>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
